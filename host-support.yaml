# Which hosts each plugin ships to. This is the only place that is decided.
#
#   true      ships the plugin to that host
#   a string  withholds it, and is the reason readers see
#
# Every plugin directory must appear here with both hosts stated. scripts/validate.rb
# fails on one that does not, so a plugin cannot reach Codex or Pi by accident, and
# cannot be withheld without a reason. scripts/generate.rb reads this file to write
# the Codex marketplace and the Pi package; neither is edited by hand.
#
# A reason must name the capability the host lacks. It is a claim about that host, so
# check the host's own documentation before writing one, and prefer running the thing.
# "I have not tried it" is not a reason — try it, then say what happened.

